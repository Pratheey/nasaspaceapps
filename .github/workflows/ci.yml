name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-hygiene:
    name: No big files or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed file over 5 MB
        run: |
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then echo "Files over 5 MB (keep them out of git, see data/README.md):"; echo "$big"; exit 1; fi
      - name: No .env or raw data committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|^data/raw/[^.]' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Should not be committed:"; echo "$bad"; exit 1; fi

  frontend-build:
    name: Frontend builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  processing-tests:
    name: Processing regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest analysis/tests data/tests radar/tests -q
